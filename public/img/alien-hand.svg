<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" role="img" aria-label="Main d’alien à trois doigts qui fait le salut vulcain">
  <defs>
    <!-- Skin: lit from the top left, like the Fluent 3D emojis -->
    <radialGradient id="skin" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#b8f58a"/>
      <stop offset=".45" stop-color="#6fd94a"/>
      <stop offset="1" stop-color="#2f8f2a"/>
    </radialGradient>
    <linearGradient id="finger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fb83a"/>
      <stop offset=".4" stop-color="#8fe86a"/>
      <stop offset="1" stop-color="#3a9a30"/>
    </linearGradient>
    <radialGradient id="pad" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#d8ffb8"/>
      <stop offset=".6" stop-color="#86e060"/>
      <stop offset="1" stop-color="#3f9f33"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0b3d10" flood-opacity=".45"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Wrist and palm -->
    <path d="M78 250 C74 222 70 205 62 182 C52 152 58 128 80 116 L150 112 C172 118 182 140 176 168 C170 196 160 214 158 250 Z" fill="url(#skin)"/>

    <!-- Left finger, apart from the other two: the "V" of the Vulcan salute -->
    <g transform="rotate(-16 88 120)">
      <rect x="72" y="36" width="32" height="96" rx="16" fill="url(#finger)"/>
      <circle cx="88" cy="36" r="19" fill="url(#pad)"/>
      <path d="M78 70 q10 4 20 0 M78 96 q10 4 20 0" stroke="#2f7f27" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".5"/>
      <ellipse cx="82" cy="30" rx="7" ry="5" fill="url(#shine)"/>
    </g>

    <!-- Two fingers held together -->
    <g transform="rotate(8 140 120)">
      <rect x="112" y="22" width="30" height="104" rx="15" fill="url(#finger)"/>
      <rect x="144" y="34" width="30" height="94" rx="15" fill="url(#finger)"/>
      <path d="M142.5 40 V124" stroke="#2c7a25" stroke-width="2" opacity=".55"/>
      <circle cx="127" cy="22" r="18" fill="url(#pad)"/>
      <circle cx="159" cy="34" r="18" fill="url(#pad)"/>
      <path d="M118 60 q9 4 18 0 M118 88 q9 4 18 0 M150 70 q9 4 18 0 M150 96 q9 4 18 0" stroke="#2f7f27" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".5"/>
      <ellipse cx="121" cy="16" rx="6.5" ry="4.5" fill="url(#shine)"/>
      <ellipse cx="153" cy="28" rx="6.5" ry="4.5" fill="url(#shine)"/>
    </g>

    <!-- Palm light and creases -->
    <ellipse cx="102" cy="150" rx="26" ry="18" fill="#fff" opacity=".18"/>
    <path d="M86 176 q30 14 62 -6" stroke="#2f7f27" stroke-width="3" fill="none" stroke-linecap="round" opacity=".35"/>
  </g>
</svg>
